name: Godot regression tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    name: Headless import and regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GODOT_VERSION: 4.7.2
      GODOT_LINUX_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out project
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install official Godot
        run: |
          release="${GODOT_VERSION}-stable"
          asset="Godot_v${release}_linux.x86_64"
          archive="$RUNNER_TEMP/$asset.zip"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$archive" \
            "https://github.com/godotengine/godot-builds/releases/download/$release/$asset.zip"
          echo "$GODOT_LINUX_SHA256  $archive" | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP/godot-bin"
          chmod +x "$RUNNER_TEMP/godot-bin/$asset"
          ln -s "$RUNNER_TEMP/godot-bin/$asset" "$RUNNER_TEMP/godot-bin/godot"
          echo "$RUNNER_TEMP/godot-bin" >> "$GITHUB_PATH"
          echo "XDG_DATA_HOME=$RUNNER_TEMP/godot-data" >> "$GITHUB_ENV"
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/godot-config" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/godot-bin/godot" --version

      - name: Import project
        run: |
          godot --headless --path . --editor --import --log-file "$RUNNER_TEMP/import.log"
          if grep -Eq '^(ERROR|SCRIPT ERROR):' "$RUNNER_TEMP/import.log"; then
            echo "::error::Godot reported an error during project import"
            exit 1
          fi

      - name: Run regression tests
        run: |
          status=0
          for suite in menu puzzle ending; do
            echo "::group::$suite regression"
            log="$RUNNER_TEMP/$suite.log"
            if ! timeout 60s godot --headless --path . --script "res://tests/${suite}_test.gd" --log-file "$log" ||
               grep -Eq '^(FAIL|ERROR|SCRIPT ERROR):' "$log"; then
              echo "::error::$suite regression failed, timed out, or reported an engine error"
              status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"
